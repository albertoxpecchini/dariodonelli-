<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Con JavaScript attivo gli elementi possono nascondersi in attesa
         della rivelazione allo scroll; senza, l'HTML prerenderizzato resta
         tutto visibile. -->
    <script>document.documentElement.classList.add('js')</script>
    <!-- Logo dello studio come icona: .ico multi-risoluzione (16→256px)
         generato dal logo originale. La variante PNG serve a iOS. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Ing. Dario Donelli | Studio tecnico a Rivalta sul Mincio (MN)</title>
    <meta
      name="description"
      content="Studio tecnico dell'Ing. Dario Donelli a Rivalta sul Mincio (Mantova): progettazione architettonica e strutturale, sicurezza sismica, riqualificazione energetica e direzione lavori."
    />

    <meta name="theme-color" content="#000000" />
    <meta name="author" content="Ing. Dario Donelli" />

    <!-- Anteprima nelle condivisioni -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="Ing. Dario Donelli | Studio tecnico" />
    <meta
      property="og:description"
      content="Progettazione, strutture, sicurezza sismica e direzione lavori a Rivalta sul Mincio e in provincia di Mantova."
    />
    <meta property="og:image" content="/images/hero-targa-og.jpg" />

    <!-- I font si caricano da qui e non da un @import nel CSS: il browser
         li scopre subito, senza aspettare che il foglio di stile sia letto. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
