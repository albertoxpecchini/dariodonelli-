<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Con JavaScript attivo gli elementi possono nascondersi in attesa
         della rivelazione allo scroll; senza, l'HTML prerenderizzato resta
         tutto visibile. -->
    <script>document.documentElement.classList.add('js')</script>
    <!-- Logo dello studio come icona: .ico multi-risoluzione (16→256px)
         generato dal logo originale. La variante PNG serve a iOS. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Ing. Dario Donelli | Studio tecnico a Rivalta sul Mincio (MN)</title>
    <meta
      name="description"
      content="Studio tecnico dell'Ing. Dario Donelli a Rivalta sul Mincio (Mantova): progettazione architettonica e strutturale, sicurezza sismica, riqualificazione energetica e direzione lavori."
    />

    <meta name="theme-color" content="#faf9f6" />
    <meta name="author" content="Ing. Dario Donelli" />

    <!-- Anteprima nelle condivisioni. Gli URL devono essere assoluti:
         gli scraper di WhatsApp e simili ignorano i percorsi relativi.
         Quando arriverà il dominio definitivo, aggiornare qui. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="Ing. Dario Donelli | Studio tecnico" />
    <meta
      property="og:description"
      content="Progettazione, strutture, sicurezza sismica e direzione lavori a Rivalta sul Mincio e in provincia di Mantova."
    />
    <meta property="og:url" content="https://dariodonelli.vercel.app/" />
    <meta property="og:image" content="https://dariodonelli.vercel.app/images/hero-targa-og.jpg" />

    <!-- Font variabili auto-ospitati (vedi i @font-face in src/index.css):
         nessuna richiesta a Google Fonts. Il preload copre i due
         sottoinsiemi latin, quelli usati in pratica da tutta la pagina. -->
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
